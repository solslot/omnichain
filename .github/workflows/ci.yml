name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject production dependency advisories
        run: npm run security:audit-production
      - name: Compile contracts
        run: npm run build
      - name: Run contract and evidence tests
        run: npm test
